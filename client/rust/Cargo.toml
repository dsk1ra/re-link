[workspace]
resolver = "2"
members = [
    "crates/client-core",
    "crates/mobile-bridge",
]

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
hex = "0.4.3"
sha2 = "0.10.9"
webrtc = "0.11.0"
ice = { package = "webrtc-ice", version = "0.11.0" }
rand = "0.9.2"
