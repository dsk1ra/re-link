[package]
name = "rust_lib_application"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
shared = { path = "../../../shared/rust" }
anyhow = { workspace = true }
flutter_rust_bridge = "=2.12.0"
tokio = { workspace = true, features = ["full"] }
webrtc = { workspace = true }
ice = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = { workspace = true }
once_cell = "1.21.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
xcap = { workspace = true }
openh264 = { workspace = true }
media = { workspace = true }
fast_image_resize = { workspace = true }
yuv = { workspace = true }
xxhash-rust = { workspace = true }
cpal = { workspace = true }
opus = { workspace = true }
rtcp = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
pipewire = { workspace = true, optional = true }
# Same xcb crate/version xcap already links (with its "randr" feature) -
# just adding "xtest" for input injection so there's one X11 client in the
# binary, not two.
xcb = { version = "1.7", features = ["xtest"] }

# flutter_rust_bridge's #[frb] macro expands to code guarded on this cfg;
# without declaring it, every annotated item warns and `-D warnings` fails CI.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[features]
# Off by default: the code now compiles either way, so a plain `cargo check`
# needs no gstreamer/pipewire dev packages. Cargokit turns it on for real
# builds. Every gate is `all(target_os = "linux", feature = "gstreamer")` -
# the deps below are Linux-only, so the feature alone never implies the
# crates are linkable.
default = []
gstreamer = ["dep:ashpd", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:pipewire"]
