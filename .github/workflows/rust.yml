name: Rust CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/rust/**'
      - 'server/rust/**'
      - 'shared/rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'client/rust/**'
      - 'server/rust/**'
      - 'shared/rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory: [server/rust, client/rust]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The client builds with --all-features, which turns on the Wayland
      # capture path: gstreamer, pipewire and the glib stack behind them, plus
      # ALSA for cpal and libclang for the -sys bindgen crates. The server
      # needs none of it.
      - name: Install system dependencies
        if: matrix.working-directory == 'client/rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libopus-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-xtest0-dev \
            libclang-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.working-directory }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --verbose
