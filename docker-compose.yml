services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-relink}_server
    environment:
      - SIGNALING_ADDR=${SIGNALING_ADDR:-0.0.0.0}
      - SIGNALING_PORT=${SIGNALING_PORT:-8080}
      - SIGNALING_PUBLIC_URL=${PUBLIC_BASE_URL:-https://${DOMAIN:-localhost}}
      - SIGNALING_REDIS_URL=${SIGNALING_REDIS_URL:-redis://redis:6379/0}
      - SIGNALING_REDIS_REQUIRE_TLS=${SIGNALING_REDIS_REQUIRE_TLS:-false}
      - SIGNALING_REDIS_KEY_PREFIX=${SIGNALING_REDIS_KEY_PREFIX:-sig}
      - SIGNALING_SESSION_TTL_SECS=${SIGNALING_SESSION_TTL_SECS:-300}
      - SIGNALING_HEARTBEAT_SECS=${SIGNALING_HEARTBEAT_SECS:-30}
      - SIGNALING_ROOM_TTL_SECS=${SIGNALING_ROOM_TTL_SECS:-30}
      - SIGNALING_JOINED_FLAG_TTL_SECS=${SIGNALING_JOINED_FLAG_TTL_SECS:-60}
      - SIGNALING_REDIS_ENCRYPT=${SIGNALING_REDIS_ENCRYPT:-false}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      - redis
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-relink}_redis
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - internal
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ${PROJECT_NAME:-relink}_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - UPSTREAM=http://server:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - internal
      - external
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: ${PROJECT_NAME:-relink}_coturn
    ports:
      - "${COTURN_STUN_PORT:-3478}:${COTURN_STUN_PORT:-3478}/udp"
      - "${COTURN_STUN_PORT:-3478}:${COTURN_STUN_PORT:-3478}/tcp"
      - "${COTURN_TLS_PORT:-5349}:${COTURN_TLS_PORT:-5349}/tcp"
      - "${COTURN_RELAY_MIN_PORT:-49160}-${COTURN_RELAY_MAX_PORT:-49200}:${COTURN_RELAY_MIN_PORT:-49160}-${COTURN_RELAY_MAX_PORT:-49200}/udp"
      - "${COTURN_RELAY_MIN_PORT:-49160}-${COTURN_RELAY_MAX_PORT:-49200}:${COTURN_RELAY_MIN_PORT:-49160}-${COTURN_RELAY_MAX_PORT:-49200}/tcp"
    environment:
      - COTURN_STUN_PORT=${COTURN_STUN_PORT:-3478}
      - COTURN_TLS_ENABLED=${COTURN_TLS_ENABLED:-false}
      - COTURN_TLS_PORT=${COTURN_TLS_PORT:-5349}
      - COTURN_REALM=${COTURN_REALM:-${DOMAIN:-localhost}}
      - COTURN_MODE=${COTURN_MODE:-stun}
      - COTURN_USERNAME=${COTURN_USERNAME:-}
      - COTURN_PASSWORD=${COTURN_PASSWORD:-}
      - COTURN_EXTERNAL_IP=${COTURN_EXTERNAL_IP:-}
      - COTURN_RELAY_MIN_PORT=${COTURN_RELAY_MIN_PORT:-49160}
      - COTURN_RELAY_MAX_PORT=${COTURN_RELAY_MAX_PORT:-49200}
    volumes:
      - ${COTURN_CERTS_DIR:-./certs}:/etc/coturn/certs:ro
    networks:
      - external
    restart: unless-stopped
    command: >
      sh -c '
      TLS_FLAGS="--no-tls --no-dtls";
      if [ "$$COTURN_TLS_ENABLED" = "true" ] || [ "$$COTURN_TLS_ENABLED" = "1" ] || [ "$$COTURN_TLS_ENABLED" = "yes" ]; then
        TLS_FLAGS="--tls-listening-port $$COTURN_TLS_PORT --cert /etc/coturn/certs/cert.crt --pkey /etc/coturn/certs/priv.key";
      fi;

      MODE_FLAGS="--stun-only --no-auth";
      if [ "$$COTURN_MODE" = "turn" ]; then
        if [ -z "$$COTURN_USERNAME" ] || [ -z "$$COTURN_PASSWORD" ]; then
          echo "COTURN_MODE=turn requires COTURN_USERNAME and COTURN_PASSWORD" >&2;
          exit 1;
        fi;
        MODE_FLAGS="--fingerprint --lt-cred-mech --user $$COTURN_USERNAME:$$COTURN_PASSWORD";
      fi;

      EXTERNAL_IP_FLAG="";
      if [ -n "$$COTURN_EXTERNAL_IP" ]; then
        EXTERNAL_IP_FLAG="--external-ip $$COTURN_EXTERNAL_IP";
      fi;

      RELAY_PORT_FLAGS="";
      if [ "$$COTURN_MODE" = "turn" ]; then
        RELAY_PORT_FLAGS="--min-port $$COTURN_RELAY_MIN_PORT --max-port $$COTURN_RELAY_MAX_PORT";
      fi;

      exec turnserver
      --log-file stdout
      --simple-log
      --realm $$COTURN_REALM
      --listening-ip 0.0.0.0
      --listening-port $$COTURN_STUN_PORT
      $$MODE_FLAGS
      $$EXTERNAL_IP_FLAG
      $$RELAY_PORT_FLAGS
      $$TLS_FLAGS
      '

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
